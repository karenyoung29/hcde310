<!DOCTYPE html>
<html>
<head><title>Art Search</title></head>
<body>
  <h1>Search the Art Institute</h1>
  <form action="/results" method="get">
    <input type="text" name="q" placeholder="e.g. cats" required>
    <button type="submit">Search</button>
    {% if message %}
      <p role="alert">{{ message }}</p>
    {% endif %}
  </form>
</body>
</html>
